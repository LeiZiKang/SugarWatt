name: KangChargeiOS
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KangChargeCore:
    path: ../../Packages/KangChargeCore
schemes:
  KangChargeiOS:
    build:
      targets:
        KangChargeiOS: all
    run:
      config: Debug
  KangChargeWatch:
    build:
      targets:
        KangChargeWatch: all
    run:
      config: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  KangChargeiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - Shared/Mobile
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
      - target: KangChargeiOSWidget
        embed: true
      - target: KangChargeWatch
        embed: true
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: SugarWatt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kangcharge]
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/KangCharge.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge
        PRODUCT_NAME: SugarWatt
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(KC_PROFILE_IOS_APP)
        ENABLE_HARDENED_RUNTIME: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KangChargeiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/iOS
      - Shared/Mobile
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
    info:
      path: Widgets/iOS/Info.plist
      properties:
        CFBundleDisplayName: SugarWatt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/iOS/KangChargeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.widget
        PRODUCT_NAME: KangChargeWidget
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(KC_PROFILE_IOS_WIDGET)
        ENABLE_HARDENED_RUNTIME: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  KangChargeWatch:
    type: application
    platform: watchOS
    sources:
      - watchOS/App
      - Shared/Mobile
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
      - target: KangChargeWatchWidget
        embed: true
    info:
      path: watchOS/App/Info.plist
      properties:
        CFBundleDisplayName: SugarWatt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge.watch
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).kangcharge
        WKApplication: true
    entitlements:
      path: watchOS/App/KangChargeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.watchkitapp
        PRODUCT_NAME: SugarWatt
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(KC_PROFILE_WATCH_APP)
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KangChargeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/watchOS
      - Shared/Mobile
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
    info:
      path: Widgets/watchOS/Info.plist
      properties:
        CFBundleDisplayName: SugarWatt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge.watch
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/watchOS/KangChargeWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.watchkitapp.widget
        PRODUCT_NAME: KangChargeWatchWidget
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: $(KC_PROFILE_WATCH_WIDGET)
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
